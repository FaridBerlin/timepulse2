<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Timepulse</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" data-tauri-drag-region>
      <!-- data-tauri-drag-region only triggers a window drag on the exact
           element it's applied to (not its children), so it's safe to put
           it on every background layer here - buttons/inputs/selects
           nested inside still get normal clicks, but any empty background
           area (behind the digits, or in the controls panel) drags the
           whole chromeless window. -->

      <!-- Small quit button, top-right corner. Hidden until you hover the
           window (see CSS) so it doesn't clutter the "just a watch" look
           when idle. Quits the whole app - unlike the overlay's ✕, which
           only goes back to the watch view. -->
      <button id="quit-corner" title="Quit Timepulse (Ctrl+Q, or right-click anywhere)">
        ✕
      </button>

      <div id="display" data-tauri-drag-region>
        <div id="digits">
          <span id="segment-h">00</span><span class="colon">:</span><span
            id="segment-m"
            >00</span
          ><span class="colon">:</span><span id="segment-s">00</span>
        </div>
        <div id="date-line">SEP 11</div>
      </div>

      <div id="controls" class="hidden" data-tauri-drag-region>
        <div class="tabs">
          <button class="tab-btn active" data-mode="clock">Clock</button>
          <button class="tab-btn" data-mode="stopwatch">Stopwatch</button>
          <button class="tab-btn" data-mode="timer">Timer</button>
        </div>

        <div id="timer-input-row" class="hidden">
          <input
            id="timer-input"
            type="text"
            placeholder="HH:MM:SS (default 00:05:00)"
          />
        </div>

        <div class="action-row">
          <button id="start-btn" class="hidden">Start</button>
          <button id="reset-btn" class="hidden">Reset</button>
        </div>

        <div class="settings-row">
          <label
            >Color
            <input id="color-picker" type="color" value="#4ade80" />
          </label>
          <label
            >Background
            <select id="bg-select">
              <option value="transparent">Transparent</option>
              <option value="#0f172a" selected>Dark</option>
              <option value="#000000">Black</option>
              <option value="custom">Custom…</option>
            </select>
          </label>
          <input
            id="bg-custom"
            type="color"
            value="#0f172a"
            class="hidden"
          />
          <label
            >Opacity
            <input id="bg-opacity" type="range" min="0" max="100" value="90" />
          </label>
        </div>

        <div class="window-row">
          <label
            ><input id="always-on-top" type="checkbox" /> Always on top</label
          >
          <button
            id="close-btn"
            title="Back to the watch (Ctrl+Q, or right-click, quits)"
          >
            ✕
          </button>
        </div>
      </div>

      <!-- Custom right-click menu - real desktop OS context menus aren't
           reachable from web content in a Tauri webview, so this is a
           small hand-built substitute, shown at the cursor position. -->
      <div id="context-menu" class="hidden">
        <button id="context-quit">Quit Timepulse</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
