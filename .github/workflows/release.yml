# Builds Timepulse for Linux and Windows and attaches the installers to a
# GitHub release.
#
# Why this exists: Windows installers (NSIS/MSI) cannot be produced on
# Linux. `cargo tauri build --bundles nsis` on a Linux machine compiles
# the binary and then silently bundles nothing at all. A Windows runner is
# the only way to get them, so the build has to happen here.
#
# Triggered by pushing a version tag:
#
#     git tag -a v0.2.0 -m "Timepulse v0.2.0"
#     git push origin v0.2.0
#
# It creates a DRAFT release. Nothing is public until you review the
# assets and press Publish yourself.

name: Release

on:
  push:
    tags:
      - "v*"
  # Lets you run it by hand from the Actions tab without tagging, to check
  # the build works before committing to a version number.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      # Don't cancel the Windows build just because Linux failed, or vice
      # versa - one broken platform shouldn't hide the other's result.
      fail-fast: false
      matrix:
        include:
          # Deliberately NOT ubuntu-latest. A binary built against a newer
          # glibc will not run on older distributions, but the reverse is
          # fine, so building on the oldest supported runner gives the
          # widest compatibility. If GitHub retires this runner the job
          # will fail to start - switch to ubuntu-latest and accept that
          # the .deb/AppImage then require a newer glibc.
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # Linux only. Windows needs nothing extra: WebView2 ships with
      # Windows 11 and current Windows 10, and Tauri's NSIS installer
      # bootstraps it on anything older.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      # Rust release builds are slow from cold. This makes repeat runs
      # take a couple of minutes instead of ten.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only set on a tag push. On a manual (workflow_dispatch) run
          # github.ref_name is the BRANCH name, which would otherwise
          # create a junk release named after the branch. With tagName
          # empty, tauri-action just builds and creates nothing - which is
          # what makes the manual run safe to use as a "does it compile on
          # Windows?" check.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Timepulse ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # On manual runs there is no release to attach to, so publish the
      # installers as workflow artifacts instead. Lets you download and
      # test a Windows build without committing to a version number.
      - name: Upload installers as artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: timepulse-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
